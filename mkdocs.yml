site_name: datamuse

site_author: thetrotfreak

repo_name: thetrotfreak/datamuse
repo_url: https://github.com/thetrotfreak/datamuse

theme:
  name: material
  # favicon: path/to/file.png
  icon:
    logo: material/language-python
    repo: material/git
  font:
    text: Noto Sans
    code: Noto Sans Mono
  palette:
    - media: "(prefers-color-scheme)"
      primary: light blue
      accent: light blue
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      primary: light blue
      accent: light blue
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      primary: light blue
      accent: light blue
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - header.autohide
    - navigation.footer
    - toc.integrate
    - content.code.copy

extra:
  generator: false
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  social:
    - icon: material/github
      link: https://github.com/thetrotfreak
      name: thetrotfreak on GitHub

plugins:
  # - optimize:
  - privacy:
  - search:
  - mkdocstrings:
      handlers:
        python:
          paths: [datamuse]
          options:
            docstring_style: sphinx
            show_source: false

markdown_extensions:
  - toc:
      anchorlink: true
      permalink: true
  - admonition:
  - pymdownx.details:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
  - pymdownx.inlinehilite:
  - pymdownx.snippets:

nav:
  - Get Started: index.md
  - Concepts: concepts.md
  - API Documentation: reference.md
  - Examples: examples.md
